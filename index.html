<style>
  :root {

  header {

  header img {

    margin-bottom: 18px;

  header h1 {

    font-weight: 800;

    background-clip: text;
    color: transparent;
    letter-spacing: 0.3px;
  }
  header p {
    margin: 0;
    color: var(--text-muted);
    position: relative;
  }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }
  .stat-card {
    background: linear-gradient(160deg, var(--surface) 0%, var(--surface-alt) 100%);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 18px;
    text-align: center;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }
  .stat-card:hover {
    transform: translateY(-4px);
    border-color: rgba(184, 59, 70, 0.35);
    box-shadow: 0 16px 34px -18px rgba(184, 59, 70, 0.4);
  }
  .stat-card .value {
    font-size: 27px;
    font-weight: 800;
    background: linear-gradient(135deg, #fff, var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .stat-card .label {
    color: var(--text-muted);
    font-size: 13px;
    margin-top: 6px;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 28px;
    align-items: center;
  }
  .controls input {
    flex: 1;
    min-width: 220px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 11px 15px;
    font-size: 14px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .controls input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(184, 59, 70, 0.22);
  }
  .filter-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .filter-btn:hover {
    transform: translateY(-2px);
    border-color: rgba(184, 59, 70, 0.4);
    color: var(--text);
  }
  .filter-btn.active {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-color: transparent;
    color: #fff;
    box-shadow: 0 8px 20px -8px rgba(184, 59, 70, 0.55);
  }
  .refresh-btn {
    margin-left: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .refresh-btn:hover {
    transform: translateY(-2px);
    border-color: rgba(184, 59, 70, 0.4);
  }
  .refresh-btn.spinning {
    opacity: 0.7;
    cursor: default;
    pointer-events: none;
  }
  .new-banner {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 20px;
    text-align: center;
    animation: bannerIn 0.3s ease;
  }
  @keyframes bannerIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes newCardGlow {
    0% { box-shadow: 0 0 0 3px rgba(184, 59, 70, 0.7), 0 26px 50px -20px rgba(184, 59, 70, 0.6); }
    100% { box-shadow: 0 10px 26px -16px rgba(0, 0, 0, 0.7); }
  }
  .card.new-vouch {
    animation: cardFadeIn 0.5s ease both, newCardGlow 2.5s ease;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    perspective: 1200px;
  }
  .card {
    position: relative;
    background: linear-gradient(160deg, var(--surface) 0%, var(--surface-alt) 100%);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow: hidden;
    box-shadow: 0 10px 26px -16px rgba(0, 0, 0, 0.7);
    transition: transform 0.12s ease-out, box-shadow 0.25s ease, border-color 0.25s ease;
    will-change: transform;
    animation: cardFadeIn 0.5s ease both;
  }
  @keyframes cardFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .card:hover {
    box-shadow: 0 26px 50px -20px rgba(0, 0, 0, 0.8);
    border-color: rgba(255, 255, 255, 0.14);
  }
  .card[data-rating="5"] { box-shadow: 0 10px 26px -16px var(--gold-glow); }
  .card[data-rating="5"]:hover { box-shadow: 0 26px 50px -18px var(--gold-glow); border-color: rgba(240, 180, 41, 0.4); }
  .card[data-rating="1"], .card[data-rating="2"] { border-color: rgba(232, 90, 90, 0.25); }
  .card[data-rating="1"]:hover, .card[data-rating="2"]:hover { box-shadow: 0 26px 50px -18px var(--low-glow); }
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(255, 255, 255, 0.16), transparent 45%);
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
    z-index: 1;
  }
  .card:hover::before {
    opacity: 1;
  }
  .card > * {
    position: relative;
    z-index: 2;
  }
  .card .top-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .rating {
    color: var(--star);
    font-weight: 700;
    letter-spacing: 1px;
    text-shadow: 0 0 18px rgba(240, 180, 41, 0.35);
  }
  .source-tag {
    font-size: 11px;
    color: var(--text-muted);
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 10px;
    white-space: nowrap;
  }
  .id-tag {
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .tags-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card .meta {
    font-size: 13px;
    color: var(--text-muted);
  }
  .card .comment {
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .card img {
    width: 100%;
    border-radius: 10px;
    border: 1px solid var(--border);
    max-height: 220px;
    object-fit: cover;
    transition: transform 0.3s ease;
  }
  .card img:hover {
    transform: scale(1.025);
  }
  .card .date {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: auto;
  }
  .receipt-link {
    font-size: 12px;
    color: var(--text);
    text-decoration: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 10px;
    text-align: center;
    background: var(--surface-alt);
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
  }
  .receipt-link:hover {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-color: transparent;
    color: #fff;
    transform: translateY(-2px);
  }
  .empty {

  }
  footer {

  .card .people {

    color: var(--text-muted);

    flex-wrap: wrap;
    gap: 4px 6px;
  }
  .mention {

    background: rgba(184, 59, 70, 0.26);
    color: #f2d6d6;
    border-radius: 4px;
    padding: 0 4px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .mention:hover {
    background: rgba(184, 59, 70, 0.5);
    text-decoration: none;
  }
  .profile-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 5, 8, 0.72);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .profile-overlay.visible {
    opacity: 1;
    pointer-events: auto;
  }
  .profile-card {
    position: relative;
    width: 300px;
    max-width: 100%;
    background: var(--surface);
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.65);
    transform: scale(0.94) translateY(10px);
    transition: transform 0.25s ease;
  }
  .profile-overlay.visible .profile-card {
    transform: scale(1) translateY(0);
  }
  .profile-banner {
    height: 60px;
  }
  .profile-close {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.5);
    color: #fff;
    border: none;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .profile-close:hover {
    background: rgba(0, 0, 0, 0.75);
    transform: scale(1.08);
  }
  .profile-avatar-wrap {
    margin-top: -40px;

  .profile-avatar {

    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
  }
  .profile-body {

  .profile-username {

  }
  .profile-id {
    font-size: 12px;

  .profile-stats {

    align-items: center;
    justify-content: center;
    z-index: 2000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .refresh-overlay.visible {
    opacity: 1;
    pointer-events: auto;
  }
  .loader-wrapper {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 70px;
    width: auto;

    font-family: "Poppins", sans-serif;
    font-size: 1.1em;
    font-weight: 600;
    user-select: none;
    color: var(--text);

    scale: 1.1;
  }
  .loader {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 100%;
    z-index: 1;

    background-color: transparent;
    mask: repeating-linear-gradient(
      90deg,
      transparent 0,
      transparent 6px,
      black 6px,
      black 9px
    );
  }
  .loader::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;

    background-image: radial-gradient(circle at 50% 50%, #ff0 0%, transparent 50%),
      radial-gradient(circle at 45% 45%, #f00 0%, transparent 45%),
      radial-gradient(circle at 55% 55%, #0ff 0%, transparent 45%),
      radial-gradient(circle at 45% 55%, #0f0 0%, transparent 45%),
      radial-gradient(circle at 55% 45%, #00f 0%, transparent 45%);
    mask: radial-gradient(
      circle at 50% 50%,
      transparent 0%,
      transparent 10%,
      black 25%
    );
    animation:
      loaderTransform 2s infinite alternate,
      loaderOpacity 4s infinite;
    animation-timing-function: cubic-bezier(0.6, 0.8, 0.5, 1);
  }
  @keyframes loaderTransform {
    0% {
      transform: translate(-55%);
    }
    100% {
      transform: translate(55%);
    }
  }
  @keyframes loaderOpacity {
    0%,
    100% {
      opacity: 0;
    }
    15% {
      opacity: 1;
    }
    65% {
      opacity: 0;
    }
  }
  .loader-letter {
    display: inline-block;
    opacity: 0;
    animation: loaderLetterAnim 4s infinite linear;
    z-index: 2;
  }
  .loader-letter:nth-child(1) { animation-delay: 0.1s; }
  .loader-letter:nth-child(2) { animation-delay: 0.205s; }
  .loader-letter:nth-child(3) { animation-delay: 0.31s; }
  .loader-letter:nth-child(4) { animation-delay: 0.415s; }
  .loader-letter:nth-child(5) { animation-delay: 0.521s; }
  .loader-letter:nth-child(6) { animation-delay: 0.626s; }
  .loader-letter:nth-child(7) { animation-delay: 0.731s; }
  .loader-letter:nth-child(8) { animation-delay: 0.837s; }
  .loader-letter:nth-child(9) { animation-delay: 0.942s; }
  .loader-letter:nth-child(10) { animation-delay: 1.047s; }
  @keyframes loaderLetterAnim {
    0% {
      filter: blur(0px);
      opacity: 0;
    }
    5% {
      opacity: 1;
      text-shadow: 0 0 4px rgba(184, 59, 70, 0.6);
      filter: blur(0px);
      transform: scale(1.1) translateY(-2px);
    }
    20% {
      opacity: 0.2;
      filter: blur(0px);
    }
    100% {
      filter: blur(5px);
      opacity: 0;
    }
  }
</style>

<script>
  let data = JSON.parse(document.getElementById('vouch-data').textContent);
  let profiles = JSON.parse(document.getElementById('profile-data').textContent);
  const grid = document.getElementById('grid');
  const emptyState = document.getElementById('empty');
  const searchInput = document.getElementById('search');
  const filterButtons = Array.from(document.querySelectorAll('.filter-btn'));
  const refreshBtn = document.getElementById('refresh-btn');
  const newBanner = document.getElementById('new-banner');
  const refreshLoader = document.getElementById('refresh-overlay');
  const REFRESH_LOADER_MIN_MS = 2200;

  function wait(ms) {
    return new Promise((resolve) => setTimeout(resolve, ms));
  }
  let currentRating = 0;
  let currentQuery = '';
  let newVouchIds = new Set();

  function ratingStars(rating) {
    return '#'.repeat(rating) + '-'.repeat(5 - rating);
  }

  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('fr-FR', { year: 'numeric', month: 'long', day: 'numeric', timeZone: 'Europe/Paris' });
  }

  function createMention(userId, label) {
    const el = document.createElement('span');
    el.className = 'mention';
    el.textContent = '@' + label;
    el.dataset.userId = userId;
    el.addEventListener('click', () => openProfile(userId));
    return el;
  }

  function render() {
    const filtered = data.filter((v) => {
      if (currentRating !== 0 && v.rating !== currentRating) return false;
      if (currentQuery) {
        const haystack = [v.product, v.comment, v.seller, v.buyer].filter(Boolean).join(' ').toLowerCase();
        if (!haystack.includes(currentQuery)) return false;
      }
      return true;
    });

    grid.innerHTML = '';
    emptyState.style.display = filtered.length === 0 ? 'block' : 'none';

    for (const vouch of filtered) {
      const card = document.createElement('div');
      card.className = newVouchIds.has(vouch.id) ? 'card new-vouch' : 'card';
      card.dataset.rating = String(vouch.rating);

      const topRow = document.createElement('div');
      topRow.className = 'top-row';
      const ratingEl = document.createElement('div');
      ratingEl.className = 'rating';
      ratingEl.textContent = ratingStars(vouch.rating) + ' (' + vouch.rating + '/5)';
      const sourceEl = document.createElement('div');
      sourceEl.className = 'source-tag';
      sourceEl.textContent = vouch.source;
      const idEl = document.createElement('div');
      idEl.className = 'id-tag';
      idEl.textContent = '#' + vouch.id;
      const tagsGroup = document.createElement('div');
      tagsGroup.className = 'tags-group';
      tagsGroup.appendChild(idEl);
      tagsGroup.appendChild(sourceEl);
      topRow.appendChild(ratingEl);
      topRow.appendChild(tagsGroup);
      card.appendChild(topRow);

      if (vouch.product || vouch.price) {
        const meta = document.createElement('div');
        meta.className = 'meta';
        const parts = [];
        if (vouch.product) parts.push(vouch.product);
        if (vouch.price) parts.push(vouch.price);
        meta.textContent = parts.join(' - ');
        card.appendChild(meta);
      }

      const people = document.createElement('div');
      people.className = 'people';
      if (vouch.sellerId) {
        const sellerLabel = document.createElement('span');
        sellerLabel.textContent = 'Vendeur : ';
        people.appendChild(sellerLabel);
        people.appendChild(createMention(vouch.sellerId, vouch.seller ? vouch.seller.replace(/^@/, '') : 'Vendeur'));
      }
      if (vouch.buyerId) {
        const buyerLabel = document.createElement('span');
        buyerLabel.textContent = 'Client : ';
        people.appendChild(buyerLabel);
        people.appendChild(createMention(vouch.buyerId, vouch.buyer ? vouch.buyer.replace(/^@/, '') : 'Client'));
      }
      if (people.childNodes.length > 0) card.appendChild(people);

      const comment = document.createElement('div');
      comment.className = 'comment';
      comment.textContent = vouch.comment;
      card.appendChild(comment);

      if (vouch.image) {
        const img = document.createElement('img');
        img.loading = 'lazy';
        img.alt = 'Preuve jointe';
        img.addEventListener('error', () => img.remove());
        img.src = vouch.image;
        card.appendChild(img);
      }

      if (vouch.receipt) {
        const receiptLink = document.createElement('a');
        receiptLink.className = 'receipt-link';
        receiptLink.href = vouch.receipt;
        receiptLink.target = '_blank';
        receiptLink.rel = 'noopener noreferrer';
        receiptLink.textContent = 'Voir le recu de vente';
        card.appendChild(receiptLink);
      }

      const dateEl = document.createElement('div');
      dateEl.className = 'date';
      dateEl.textContent = formatDate(vouch.date);
      card.appendChild(dateEl);

      attachTiltEffect(card);
      grid.appendChild(card);
    }
  }

  const supportsHoverTilt = window.matchMedia('(pointer: fine)').matches;
  function attachTiltEffect(card) {
    if (!supportsHoverTilt) return;
    const maxTilt = 7;
    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const px = (e.clientX - rect.left) / rect.width;
      const py = (e.clientY - rect.top) / rect.height;
      const rotateY = (px - 0.5) * maxTilt * 2;
      const rotateX = (0.5 - py) * maxTilt * 2;
      card.style.transform = 'perspective(900px) rotateX(' + rotateX.toFixed(2) + 'deg) rotateY(' + rotateY.toFixed(2) + 'deg) scale(1.015)';
      card.style.setProperty('--mx', (px * 100) + '%');
      card.style.setProperty('--my', (py * 100) + '%');
    });
    card.addEventListener('mouseleave', () => {
      card.style.transform = '';
    });
  }

  searchInput.addEventListener('input', (e) => {
    currentQuery = e.target.value.trim().toLowerCase();
    render();
  });

  filterButtons.forEach((btn) => {
    btn.addEventListener('click', () => {
      filterButtons.forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      currentRating = Number(btn.dataset.rating);
      render();
    });
  });

  const profileOverlay = document.getElementById('profile-overlay');
  const profileBanner = document.getElementById('profile-banner');
  const profileAvatar = document.getElementById('profile-avatar');
  const profileUsername = document.getElementById('profile-username');
  const profileIdEl = document.getElementById('profile-id');
  const profileBuyerCount = document.getElementById('profile-buyer-count');
  const profileSellerCount = document.getElementById('profile-seller-count');
  const profileAvgRating = document.getElementById('profile-avg-rating');
  const profileCloseBtn = document.getElementById('profile-close');

  function hashHue(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
      hash = str.charCodeAt(i) + ((hash << 5) - hash);
    }
    return Math.abs(hash) % 360;
  }

  function computeUserStats(userId) {
    const asBuyer = data.filter((v) => v.buyerId === userId);
    const asSeller = data.filter((v) => v.sellerId === userId);
    const avg = asSeller.length > 0 ? asSeller.reduce((sum, v) => sum + v.rating, 0) / asSeller.length : 0;
    return { buyerCount: asBuyer.length, sellerCount: asSeller.length, avgRating: avg };
  }

  function openProfile(userId) {
    const profile = profiles[userId] || { tag: 'Utilisateur inconnu', avatar: null, banner: null, accentColor: null };
    const stats = computeUserStats(userId);
    const hue = hashHue(String(userId));

    if (profile.banner) {
      profileBanner.style.background = '';
      profileBanner.style.backgroundImage = 'url(' + profile.banner + ')';
      profileBanner.style.backgroundSize = 'cover';
      profileBanner.style.backgroundPosition = 'center';
    } else if (profile.accentColor) {
      profileBanner.style.backgroundImage = '';
      profileBanner.style.background = profile.accentColor;
    } else {
      profileBanner.style.backgroundImage = '';
      profileBanner.style.background = 'linear-gradient(135deg, hsl(' + hue + ', 65%, 45%), hsl(' + ((hue + 40) % 360) + ', 55%, 30%))';
    }
    if (profile.avatar) {
      profileAvatar.src = profile.avatar;
      profileAvatar.style.display = 'block';
    } else {
      profileAvatar.removeAttribute('src');
      profileAvatar.style.display = 'none';
    }
    profileUsername.textContent = '@' + profile.tag.replace(/^@/, '');
    profileIdEl.textContent = 'ID : ' + userId;
    profileBuyerCount.textContent = String(stats.buyerCount);
    profileSellerCount.textContent = String(stats.sellerCount);
    profileAvgRating.textContent = stats.sellerCount > 0 ? stats.avgRating.toFixed(2) + ' / 5' : 'N/A';

    profileOverlay.classList.add('visible');
  }

  function closeProfile() {
    profileOverlay.classList.remove('visible');
  }

  profileOverlay.addEventListener('click', (e) => {
    if (e.target === profileOverlay) closeProfile();
  });
  profileCloseBtn.addEventListener('click', closeProfile);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeProfile();
  });

  function showBanner(message, duration) {
    newBanner.textContent = message;
    newBanner.style.display = 'block';
    setTimeout(() => { newBanner.style.display = 'none'; }, duration);
  }

  async function refreshData() {
    if (refreshBtn.classList.contains('spinning')) return;
    refreshBtn.classList.add('spinning');
    refreshLoader.classList.add('visible');
    const originalLabel = refreshBtn.textContent;
    refreshBtn.textContent = 'Actualisation...';

    try {
      const [text] = await Promise.all([
        (async () => {
          const response = await fetch(location.pathname + '?t=' + Date.now(), { cache: 'no-store' });
          if (!response.ok) throw new Error('HTTP ' + response.status);
          return response.text();
        })(),
        wait(REFRESH_LOADER_MIN_MS)
      ]);

      const parsedPage = new DOMParser().parseFromString(text, 'text/html');
      const newDataScript = parsedPage.getElementById('vouch-data');
      const newProfilesScript = parsedPage.getElementById('profile-data');
      if (!newDataScript) throw new Error('Donnees introuvables dans la page actualisee');

      const newData = JSON.parse(newDataScript.textContent);
      const newProfiles = newProfilesScript ? JSON.parse(newProfilesScript.textContent) : {};

      const existingIds = new Set(data.map((v) => v.id));
      const arrivedIds = newData.filter((v) => !existingIds.has(v.id)).map((v) => v.id);

      data = newData;
      profiles = newProfiles;
      newVouchIds = new Set(arrivedIds);

      render();

      if (arrivedIds.length > 0) {
        showBanner(
          arrivedIds.length === 1 ? "1 nouvel avis vient d'arriver !" : arrivedIds.length + " nouveaux avis viennent d'arriver !",
          6000
        );
      } else {
        showBanner('Aucun nouvel avis pour le moment.', 3000);
      }
    } catch (err) {
      showBanner("Impossible d'actualiser pour le moment. Reessayez plus tard.", 4000);
    } finally {
      refreshLoader.classList.remove('visible');
      refreshBtn.classList.remove('spinning');
      refreshBtn.textContent = originalLabel;
    }
  }

  refreshBtn.addEventListener('click', refreshData);

  render();
</script>
