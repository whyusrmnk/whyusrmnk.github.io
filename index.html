<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ExShop #CHEAP - Avis clients</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #16171a;
    --surface: #1e2023;
    --surface-alt: #26282c;
    --border: #313339;
    --text: #e7e9ee;
    --text-muted: #9298a3;
    --accent: #5865f2;
    --star: #e0a94a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    padding: 48px 24px 32px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%);
  }
  header img {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    margin-bottom: 16px;
    border: 2px solid var(--border);
  }
  header h1 {
    margin: 0 0 8px;
    font-size: 28px;
  }
  header p {
    margin: 0;
    color: var(--text-muted);
  }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    text-align: center;
  }
  .stat-card .value {
    font-size: 26px;
    font-weight: 700;
  }
  .stat-card .label {
    color: var(--text-muted);
    font-size: 13px;
    margin-top: 4px;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 28px;
    align-items: center;
  }
  .controls input {
    flex: 1;
    min-width: 220px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 14px;
    font-size: 14px;
  }
  .filter-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 18px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card .top-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .rating {
    color: var(--star);
    font-weight: 700;
    letter-spacing: 1px;
  }
  .source-tag {
    font-size: 11px;
    color: var(--text-muted);
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 10px;
    white-space: nowrap;
  }
  .id-tag {
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .tags-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card .meta {
    font-size: 13px;
    color: var(--text-muted);
  }
  .card .comment {
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .card img {
    width: 100%;
    border-radius: 8px;
    border: 1px solid var(--border);
    max-height: 220px;
    object-fit: cover;
  }
  .card .date {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: auto;
  }
  .empty {
    text-align: center;
    color: var(--text-muted);
    padding: 60px 0;
  }
  footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    padding: 24px;
    border-top: 1px solid var(--border);
  }
  .card .people {
    font-size: 13px;
    color: var(--text-muted);
    display: flex;
    flex-wrap: wrap;
    gap: 4px 6px;
  }
  .mention {
    display: inline;
    background: rgba(88, 101, 242, 0.3);
    color: #c9cdfb;
    border-radius: 3px;
    padding: 0 3px;
    font-weight: 500;
    cursor: pointer;
  }
  .mention:hover {
    background: rgba(88, 101, 242, 0.55);
    text-decoration: none;
  }
  .profile-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .profile-overlay.visible {
    display: flex;
  }
  .profile-card {
    position: relative;
    width: 300px;
    max-width: 100%;
    background: var(--surface);
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
  }
  .profile-banner {
    height: 60px;
  }
  .profile-close {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.5);
    color: #fff;
    border: none;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
  }
  .profile-avatar-wrap {
    margin-top: -40px;
    padding: 0 16px;
  }
  .profile-avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 6px solid var(--surface);
    background: var(--surface-alt);
    object-fit: cover;
    display: block;
  }
  .profile-body {
    padding: 8px 16px 18px;
  }
  .profile-username {
    font-size: 18px;
    font-weight: 700;
    margin-top: 8px;
  }
  .profile-id {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 14px;
  }
  .profile-stats {
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    text-align: center;
  }
  .profile-stats .stat-value {
    font-size: 16px;
    font-weight: 700;
  }
  .profile-stats .stat-label {
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 2px;
  }
</style>
</head>
<body>
<header>
  <img src="https://cdn.discordapp.com/icons/1529585731159457873/113eeebffa1b5767605ca82cfbddb558.webp?size=128" alt="Icone du serveur">
  <h1>ExShop #CHEAP</h1>
  <p>〃 Avis et retours de notre communauté 〃</p>
</header>
<main>
  <div class="stats">
    <div class="stat-card"><div class="value">4</div><div class="label">Avis au total</div></div>
    <div class="stat-card"><div class="value">5.00 / 5</div><div class="label">Note moyenne</div></div>
    <div class="stat-card"><div class="value">3</div><div class="label">Membres ayant laisse un avis</div></div>
  </div>
  <div class="controls">
    <input type="text" id="search" placeholder="Rechercher un mot-cle...">
    <button class="filter-btn active" data-rating="0">Tous</button>
    <button class="filter-btn" data-rating="5">5</button>
    <button class="filter-btn" data-rating="4">4</button>
    <button class="filter-btn" data-rating="3">3</button>
    <button class="filter-btn" data-rating="2">2</button>
    <button class="filter-btn" data-rating="1">1</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none;">Aucun avis ne correspond a votre recherche.</div>
</main>
<footer>Generé et posté par VouchsBot by why</footer>
<div class="profile-overlay" id="profile-overlay">
  <div class="profile-card">
    <button class="profile-close" id="profile-close" aria-label="Fermer">&#10005;</button>
    <div class="profile-banner" id="profile-banner"></div>
    <div class="profile-avatar-wrap">
      <img class="profile-avatar" id="profile-avatar" alt="Avatar">

      <div class="profile-stats">
        <div>
          <div class="stat-value" id="profile-buyer-count">0</div>

          <div class="stat-value" id="profile-seller-count">0</div>

          <div class="stat-value" id="profile-avg-rating">N/A</div>
          <div class="stat-label">Note moyenne</div>

      </div>
    </div>
  </div>
</div>

<script>
  const data = JSON.parse(document.getElementById('vouch-data').textContent);
  const profiles = JSON.parse(document.getElementById('profile-data').textContent);
  const grid = document.getElementById('grid');
  const emptyState = document.getElementById('empty');
  const searchInput = document.getElementById('search');
  const filterButtons = Array.from(document.querySelectorAll('.filter-btn'));
  let currentRating = 0;
  let currentQuery = '';

  function ratingStars(rating) {
    return '#'.repeat(rating) + '-'.repeat(5 - rating);
  }

  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('fr-FR', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  function createMention(userId, label) {
    const el = document.createElement('span');
    el.className = 'mention';
    el.textContent = '@' + label;
    el.dataset.userId = userId;
    el.addEventListener('click', () => openProfile(userId));
    return el;
  }

  function render() {
    const filtered = data.filter((v) => {
      if (currentRating !== 0 && v.rating !== currentRating) return false;
      if (currentQuery) {
        const haystack = [v.product, v.comment, v.seller, v.buyer].filter(Boolean).join(' ').toLowerCase();
        if (!haystack.includes(currentQuery)) return false;
      }
      return true;
    });

    grid.innerHTML = '';
    emptyState.style.display = filtered.length === 0 ? 'block' : 'none';

    for (const vouch of filtered) {
      const card = document.createElement('div');
      card.className = 'card';

      const topRow = document.createElement('div');
      topRow.className = 'top-row';
      const ratingEl = document.createElement('div');
      ratingEl.className = 'rating';
      ratingEl.textContent = ratingStars(vouch.rating) + ' (' + vouch.rating + '/5)';
      const sourceEl = document.createElement('div');
      sourceEl.className = 'source-tag';
      sourceEl.textContent = vouch.source;
      const idEl = document.createElement('div');
      idEl.className = 'id-tag';
      idEl.textContent = '#' + vouch.id;
      const tagsGroup = document.createElement('div');
      tagsGroup.className = 'tags-group';
      tagsGroup.appendChild(idEl);
      tagsGroup.appendChild(sourceEl);
      topRow.appendChild(ratingEl);
      topRow.appendChild(tagsGroup);
      card.appendChild(topRow);

      if (vouch.product || vouch.price) {
        const meta = document.createElement('div');
        meta.className = 'meta';
        const parts = [];
        if (vouch.product) parts.push(vouch.product);
        if (vouch.price) parts.push(vouch.price);
        meta.textContent = parts.join(' - ');
        card.appendChild(meta);
      }

      const people = document.createElement('div');
      people.className = 'people';
      if (vouch.sellerId) {
        const sellerLabel = document.createElement('span');
        sellerLabel.textContent = 'Vendeur : ';
        people.appendChild(sellerLabel);
        people.appendChild(createMention(vouch.sellerId, vouch.seller ? vouch.seller.replace(/^@/, '') : 'Vendeur'));
      }
      if (vouch.buyerId) {
        const buyerLabel = document.createElement('span');
        buyerLabel.textContent = 'Client : ';
        people.appendChild(buyerLabel);
        people.appendChild(createMention(vouch.buyerId, vouch.buyer ? vouch.buyer.replace(/^@/, '') : 'Client'));
      }
      if (people.childNodes.length > 0) card.appendChild(people);

      const comment = document.createElement('div');
      comment.className = 'comment';
      comment.textContent = vouch.comment;
      card.appendChild(comment);

      if (vouch.image) {
        const img = document.createElement('img');
        img.src = vouch.image;
        img.loading = 'lazy';
        img.alt = 'Preuve jointe';
        card.appendChild(img);
      }

      const dateEl = document.createElement('div');
      dateEl.className = 'date';
      dateEl.textContent = formatDate(vouch.date);
      card.appendChild(dateEl);

      grid.appendChild(card);
    }
  }

  searchInput.addEventListener('input', (e) => {
    currentQuery = e.target.value.trim().toLowerCase();
    render();
  });

  filterButtons.forEach((btn) => {
    btn.addEventListener('click', () => {
      filterButtons.forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      currentRating = Number(btn.dataset.rating);
      render();
    });
  });

  const profileOverlay = document.getElementById('profile-overlay');
  const profileBanner = document.getElementById('profile-banner');
  const profileAvatar = document.getElementById('profile-avatar');
  const profileUsername = document.getElementById('profile-username');
  const profileIdEl = document.getElementById('profile-id');
  const profileBuyerCount = document.getElementById('profile-buyer-count');
  const profileSellerCount = document.getElementById('profile-seller-count');
  const profileAvgRating = document.getElementById('profile-avg-rating');
  const profileCloseBtn = document.getElementById('profile-close');

  function hashHue(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
      hash = str.charCodeAt(i) + ((hash << 5) - hash);
    }
    return Math.abs(hash) % 360;
  }

  function computeUserStats(userId) {
    const asBuyer = data.filter((v) => v.buyerId === userId);
    const asSeller = data.filter((v) => v.sellerId === userId);
    const avg = asSeller.length > 0 ? asSeller.reduce((sum, v) => sum + v.rating, 0) / asSeller.length : 0;
    return { buyerCount: asBuyer.length, sellerCount: asSeller.length, avgRating: avg };
  }

  function openProfile(userId) {
    const profile = profiles[userId] || { tag: 'Utilisateur inconnu', avatar: null, banner: null, accentColor: null };
    const stats = computeUserStats(userId);
    const hue = hashHue(String(userId));

    if (profile.banner) {
      profileBanner.style.background = '';
      profileBanner.style.backgroundImage = 'url(' + profile.banner + ')';
      profileBanner.style.backgroundSize = 'cover';
      profileBanner.style.backgroundPosition = 'center';
    } else if (profile.accentColor) {
      profileBanner.style.backgroundImage = '';
      profileBanner.style.background = profile.accentColor;
    } else {
      profileBanner.style.backgroundImage = '';
      profileBanner.style.background = 'linear-gradient(135deg, hsl(' + hue + ', 65%, 45%), hsl(' + ((hue + 40) % 360) + ', 55%, 30%))';
    }
    if (profile.avatar) {
      profileAvatar.src = profile.avatar;
      profileAvatar.style.display = 'block';
    } else {
      profileAvatar.removeAttribute('src');
      profileAvatar.style.display = 'none';
    }
    profileUsername.textContent = '@' + profile.tag.replace(/^@/, '');
    profileIdEl.textContent = 'ID : ' + userId;
    profileBuyerCount.textContent = String(stats.buyerCount);
    profileSellerCount.textContent = String(stats.sellerCount);
    profileAvgRating.textContent = stats.sellerCount > 0 ? stats.avgRating.toFixed(2) + ' / 5' : 'N/A';

    profileOverlay.classList.add('visible');
  }

  function closeProfile() {
    profileOverlay.classList.remove('visible');
  }

  profileOverlay.addEventListener('click', (e) => {
    if (e.target === profileOverlay) closeProfile();
  });
  profileCloseBtn.addEventListener('click', closeProfile);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeProfile();
  });

  render();
</script>
</body>
</html>
